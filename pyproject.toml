[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-graph-trade"
version = "0.4.0"
description = "Logiciel de trading intelligent qui scanne les captures de graphiques et donne un pronostic argumenté"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christ" }]
keywords = ["trading", "chandeliers japonais", "ocr", "opencv", "computer-vision", "analyse technique"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]
ml = ["scikit-learn>=1.4", "easyocr>=1.7"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
desktop = ["pywebview>=5.0"]

[project.scripts]
sgt = "scan_graph_trade.cli:main"

[project.gui-scripts]
sgt-app = "scan_graph_trade.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scan_graph_trade = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF"]
# B008 : idiome FastAPI (File(...)) · RUF001-003 : typographie française (×, apostrophes)
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
